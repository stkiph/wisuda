<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Kehadiran Wisuda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Scanner HTML5 QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-800 rounded-xl p-6 shadow-2xl border border-gray-700 text-center">
    <h1 class="text-2xl font-bold mb-2 text-indigo-400">Scanner Pintu Masuk</h1>
    <p class="text-gray-400 text-sm mb-4">Arahkan kamera ke QR Code / Barcode Undangan Tamu</p>

    <!-- Area Video Kamera Scanner -->
    <div id="reader" class="overflow-hidden rounded-lg border-2 border-indigo-500 mb-4 bg-black"></div>

    <!-- Status Hasil Scan -->
    <div id="resultBox" class="p-4 rounded-lg hidden text-left font-sans transition-all duration-300">
      <p id="resultStatus" class="font-bold text-lg mb-1"></p>
      <p id="resultNama" class="text-xl font-extrabold"></p>
      <p id="resultKategori" class="text-sm mt-1"></p>
    </div>
  </div>

  <script src="scanner.js"></script>
</body>
</html>
